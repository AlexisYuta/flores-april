<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111b21">
<title>Tus flores, April 💛</title>
<style>
*{box-sizing:border-box}
:root{
  --wa:#111b21;
  --wa2:#202c33;
  --bubble:#005c4b;
  --yellow:#ffd43b;
  --gold:#e8ad25;
  --green:#3e7d45;
}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:#080f13; color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.chat{
  position:relative;
  width:min(430px,100vw); height:min(760px,100vh);
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.035) 0 1px,transparent 2px),
    radial-gradient(circle at 80% 70%,rgba(255,255,255,.025) 0 1px,transparent 2px),
    var(--wa);
  background-size:38px 38px,52px 52px;
}
.header{
  height:62px; display:flex; align-items:center; gap:12px;
  padding:0 16px; background:var(--wa2);
  box-shadow:0 1px 3px #0005; position:relative; z-index:2;
}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#d9a92f;font-size:20px}
.name{font-weight:650}.online{font-size:12px;color:#a9b7bd;margin-top:2px}
.messages{
  position:absolute; inset:62px 0 0; padding:22px 14px;
  display:flex; flex-direction:column; justify-content:flex-end; gap:10px;
}
.bubble{
  align-self:flex-end; width:min(300px,82%);
  background:var(--bubble); border-radius:12px 3px 12px 12px;
  padding:13px 13px 8px; box-shadow:0 2px 4px #0005;
  animation:slide .45s ease both;
}
.bubble p{margin:0 0 10px;line-height:1.4;font-size:16px}
.open{
  width:100%; border:0; border-radius:9px; padding:13px 12px;
  background:var(--yellow); color:#3b2d00; font-weight:750; font-size:15px;
  cursor:pointer; box-shadow:0 2px 0 #0002; transition:transform .15s,filter .15s;
}
.open:active{transform:scale(.98)} .open:hover{filter:brightness(1.04)}
.meta{text-align:right;color:#b9d8d2;font-size:11px;margin-top:5px}
.status{letter-spacing:-2px;color:#61b6ff}

/* Presentación del ramo */
.reveal{
  position:absolute; inset:0; z-index:5;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:30px 20px 20px;
  background:linear-gradient(180deg,#111b21 0%,#17231f 100%);
  opacity:0; pointer-events:none; transition:opacity .45s ease;
}
.reveal.show{opacity:1;pointer-events:auto}
.reveal-title{
  font-family:Georgia,serif; font-size:28px; margin:8px 0 4px;
  color:#ffe58a; text-align:center; opacity:0; transform:translateY(12px);
}
.reveal-sub{margin:0;color:#b9c8c2;font-size:14px;opacity:0;transform:translateY(10px)}
.reveal.show .reveal-title,.reveal.show .reveal-sub{
  animation:up .65s .55s ease forwards;
}
.reveal.show .reveal-sub{animation-delay:.75s}
.close{
  position:absolute; top:14px; right:14px; width:42px;height:42px;
  border:1px solid #ffffff25;border-radius:50%;background:#ffffff0d;color:#fff;
  font-size:22px;cursor:pointer; z-index:10;
}

/* Ramo dibujado con CSS */
.bouquet{
  position:relative; width:min(350px,90vw); height:460px; margin-top:20px;
}

.flower{
  position:absolute; width:95px;height:95px;
  transform:translateY(35px) scale(.2); opacity:0;
  z-index:2;
}
.reveal.show .flower{animation:bloom .75s cubic-bezier(.2,.85,.25,1) forwards}

/* Posicionamiento compacto de cada flor */
.f4{left:80px; top:50px}
.f5{left:175px; top:50px}
.f1{left:45px; top:110px}
.f2{left:127.5px; top:100px}
.f3{left:210px; top:110px}
.f6{left:127.5px; top:165px}

/* Tallos ordenados y más derechos */
.f1 .stem{transform:rotate(10deg); height:200px; left:47px; top:45px}
.f2 .stem{transform:rotate(3deg); height:210px; left:47px; top:45px}
.f3 .stem{transform:rotate(-10deg); height:200px; left:47px; top:45px}
.f4 .stem{transform:rotate(6deg); height:250px; left:47px; top:45px}
.f5 .stem{transform:rotate(-6deg); height:250px; left:47px; top:45px}
.f6 .stem{transform:rotate(0deg); height:160px; left:47px; top:45px}

.reveal.show .f1{animation-delay:.15s}.reveal.show .f2{animation-delay:.28s}
.reveal.show .f3{animation-delay:.4s}.reveal.show .f4{animation-delay:.52s}
.reveal.show .f5{animation-delay:.64s}.reveal.show .f6{animation-delay:.76s}

.petals{position:absolute;inset:0;z-index:2;}
.petal{
  position:absolute;left:32px;top:0px;width:30px;height:48px;
  border-radius:55% 55% 45% 45%;background:var(--yellow);
  transform-origin:15px 48px;
}
.p1{transform:rotate(0)}.p2{transform:rotate(45deg)}.p3{transform:rotate(90deg)}
.p4{transform:rotate(135deg)}.p5{transform:rotate(180deg)}.p6{transform:rotate(225deg)}
.p7{transform:rotate(270deg)}.p8{transform:rotate(315deg)}
.center{
  position:absolute;left:30px;top:30px;width:35px;height:35px;border-radius:50%;
  background:#714516;border:5px solid #9a6220;
  box-shadow:inset 0 0 0 5px #5b3711;z-index:3;
}
.stem{
  position:absolute;width:7px;
  background:var(--green);border-radius:8px;
  transform-origin:top center;z-index:1;
}
.leaf{
  position:absolute;left:18px;top:80px;width:36px;height:18px;
  background:#518e4e;border-radius:100% 0;transform:rotate(-20deg);z-index:1;
}

/* Envoltura/Cono ajustado para contener las flores */
.wrap{
  position:absolute;left:50%;bottom:0px;transform:translateX(-50%);
  width:270px;height:245px;
  background:linear-gradient(135deg,#d6a56a,#ad6e36);
  clip-path:polygon(0% 0%, 100% 0%, 65% 100%, 35% 100%);
  filter:drop-shadow(0 8px 8px #0008);z-index:3;
}
.wrap::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 35%,#ffffff22 36%,transparent 37%);
}

/* Cinta decorativa */
.ribbon{
  position:absolute;z-index:4;left:50%;bottom:125px;transform:translateX(-50%);
  width:85px;height:22px;background:#e9b82c;border-radius:4px;
}
.ribbon:before,.ribbon:after{
  content:"";position:absolute;top:-6px;width:42px;height:34px;background:#e9b82c;
}
.ribbon:before{right:52px;transform:rotate(25deg);border-radius:4px;}
.ribbon:after{left:52px;transform:rotate(-25deg);border-radius:4px;}

/* Nota adhesiva */
.note{
  position:absolute;z-index:6;left:50%;bottom:28px;transform:translateX(-50%) rotate(-2deg);
  background:#fff7dc;color:#513e17;padding:8px 14px;width:175px;
  text-align:center;font-family:"Comic Sans MS",cursive;font-size:15px;
  box-shadow:0 3px 8px #0004;opacity:0;border-radius:6px;
}
.reveal.show .note{animation:noteIn .7s 1.25s ease forwards}

.sparkle{
  position:absolute;color:#ffe58a;font-size:22px;opacity:0;z-index:5;
}
.s1{left:20px;top:45px}.s2{right:25px;top:65px}.s3{left:45%;top:115px}
.reveal.show .sparkle{animation:spark .9s 1.3s ease forwards}
.s2{animation-delay:1.45s!important}.s3{animation-delay:1.6s!important}

@keyframes slide{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes bloom{0%{opacity:0;transform:translateY(35px) scale(.2) rotate(-10deg)}75%{transform:translateY(-5px) scale(1.06) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes noteIn{from{opacity:0;transform:translateX(-50%) translateY(15px) rotate(-8deg)}to{opacity:1;transform:translateX(-50%) rotate(-2deg)}}
@keyframes spark{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@media (max-height:650px){
  .reveal{padding-top:20px}
  .reveal-title{font-size:24px}
  .bouquet{margin-top:10px;height:430px;transform:scale(.88);transform-origin:top center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal.show .flower{opacity:1;transform:none}.reveal.show .note{opacity:1}}
</style>
</head>
<body>
<main class="chat">
  <header class="header">
    <div class="avatar">🌻</div>
    <div><div class="name">April</div><div class="online">en línea</div></div>
  </header>

  <section class="messages">
    <div class="bubble">
      <p>Te quería mandar algo... 💛</p>
      <button class="open" id="open">🌼 Tus flores, April</button>
      <div class="meta">11:20 a. m. <span class="status">✓✓</span></div>
    </div>
  </section>

  <section class="reveal" id="reveal" aria-hidden="true">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <h1 class="reveal-title">Tus flores, April 💛</h1>
    <p class="reveal-sub">Hechas especialmente para ti.</p>

    <div class="bouquet" aria-label="Ramo de flores amarillas">
      <span class="sparkle s1">✦</span><span class="sparkle s2">✦</span><span class="sparkle s3">✧</span>

      <!-- Flores agrupadas dentro del ramo -->
      <div class="flower f1"><div class="petals"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i></div><div class="center"></div><div class="stem"></div><div class="leaf"></div></div>
      <div class="flower f2"><div class="petals"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i></div><div class="center"></div><div class="stem"></div><div class="leaf"></div></div>
      <div class="flower f3"><div class="petals"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i></div><div class="center"></div><div class="stem"></div><div class="leaf"></div></div>
      <div class="flower f4"><div class="petals"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i></div><div class="center"></div><div class="stem"></div></div>
      <div class="flower f5"><div class="petals"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i></div><div class="center"></div><div class="stem"></div></div>
      <div class="flower f6"><div class="petals"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><i class="petal p6"></i><i class="petal p7"></i><i class="petal p8"></i></div><div class="center"></div><div class="stem"></div></div>

      <!-- Envoltura y tarjeta -->
      <div class="wrap"></div>
      <div class="ribbon"></div>
      <div class="note">Para ti,<br>April 💛</div>
    </div>
  </section>
</main>

<script>
(() => {
  const reveal = document.getElementById("reveal");
  const open = document.getElementById("open");
  const close = document.getElementById("close");

  open.addEventListener("click", () => {
    reveal.classList.add("show");
    reveal.setAttribute("aria-hidden","false");
  });

  close.addEventListener("click", () => {
    reveal.classList.remove("show");
    reveal.setAttribute("aria-hidden","true");
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") close.click();
  });
})();
</script>
</body>
</html>
